---
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Skip the rebuild when nothing docs-related changed. A filtered-out run
    # reports as neutral, not success: remove these filters if this check ever
    # becomes a required status check on main.
    paths:
      - "website/**"
      - "**.md"
      - ".github/workflows/docs-deploy.yml"

# Read-only by default; only the deploy job may push to the gh-pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    name: Lint Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Lint docs (pre-commit)
        run: uv run pre-commit run markdownlint --all-files

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4