---
name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Keep ansible-core in step with the version used to deploy, and these
      # pins in step with the revs in .pre-commit-config.yaml.
      - name: Install test dependencies
        run: pip3 install ansible-core==2.21.4 ansible-lint==26.10.1 yamllint==1.38.0

      - name: Ansible-lint
        run: ansible-lint nas.yml

      - name: Lint yaml files
        run: yamllint .

      - name: Check role enabled flags
        run: tests/check-enabled-vars.sh

      - name: Lint docs
        uses: articulate/actions-markdownlint@v1
        with:
          version: 0.32.2
