---
name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags: check_breaking_changes.py diffs against the
          # last release tag, which a shallow clone does not have.
          fetch-depth: 0

      # Tool versions come from uv.lock and .pre-commit-config.yaml, the same
      # ones `make lint` uses locally, so CI and local runs cannot drift.
      - name: Set up uv
        # setup-uv publishes no floating major tag, only full versions.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Lint (pre-commit hooks and repo checks)
        run: make lint

      - name: Unit tests for the scripts
        run: make test-unit
