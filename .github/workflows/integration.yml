---
name: Integration

on:
  # Test the roles a PR changes
  pull_request:
    branches: [main]
    paths:
      - "roles/**"
      - "tests/molecule/**"
      - "tests/github-test-matrix.sh"
      - ".github/workflows/integration.yml"

  # Test every role weekly, to catch upstream images that break or disappear
  schedule:
    - cron: "0 3 * * 1"

  # Test every role on demand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the PR can be diffed against its base branch
          fetch-depth: 0
      - name: Generate Test Matrix
        id: set-matrix
        shell: bash
        run: "tests/github-test-matrix.sh"

  test:
    # No matrix expression here: a skipped job would show it unexpanded.
    # GitHub appends the role itself, e.g. "Molecule (roles/zigbee2mqtt)".
    name: Molecule
    needs: generate-matrix
    # A PR that only touches roles without molecule tests has nothing to run
    if: needs.generate-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Keep testing the other roles when one fails
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Installed here rather than through a molecule action, whose image is a
      # floating tag rebuilt weekly. Keep ansible-core in step with ci.yml.
      - name: Install test dependencies
        run: pip3 install -r requirements-dev.txt ansible-core==2.21.4

      # Molecule doesn't install these: the scenarios have no requirements file
      - name: Install Ansible roles and collections
        run: ansible-galaxy install -r requirements.yml

      - name: Molecule Test
        working-directory: ${{ matrix.role }}
        run: molecule --base-config ../../tests/molecule/base.yml test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
