---
name: Integration

on:
  # Test the roles a PR changes
  pull_request:
    branches: [main]
    paths:
      - "roles/**"
      - "tests/molecule/**"
      - "tests/github-test-matrix.sh"
      - ".github/workflows/integration.yml"

  # Test every role weekly, to catch upstream images that break or disappear
  schedule:
    - cron: "0 3 * * 1"

  # Test every role on demand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the PR can be diffed against its base branch
          fetch-depth: 0
      - name: Generate Test Matrix
        id: set-matrix
        shell: bash
        run: "tests/github-test-matrix.sh"

  test:
    name: "Test ${{ matrix.role }}"
    needs: generate-matrix
    # A PR that only touches roles without molecule tests has nothing to run
    if: needs.generate-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Keep testing the other roles when one fails
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Molecule Test
        uses: gofrolist/molecule-action@dfbfd1af6a77523c8a937a1532f92808065a00a4
        with:
          molecule_options: --base-config ../../tests/molecule/base.yml
          molecule_command: test
          molecule_working_dir: ${{ matrix.role }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
