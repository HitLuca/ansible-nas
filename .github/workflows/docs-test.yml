---
name: Test Website Deployment

on:
  pull_request:
    branches:
      - main
    # Skip docs checks when nothing docs-related changed. A filtered-out run
    # reports as neutral, not success: remove these filters if the docs checks
    # become required status checks on main.
    paths:
      - "website/**"
      - "**.md"
      - ".github/workflows/docs-test.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint docs
        run: npx --yes markdownlint-cli@0.49.1 .

  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build