---
name: Release

# A pushed version tag opens a draft GitHub release from the changelog; review
# and publish it by hand.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "${{ github.ref_name }}" origin/main; then
            echo "Tag ${{ github.ref_name }} is not an ancestor of origin/main"
            exit 1
          fi

      - name: Set up Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Build the release notes
        run: python3 scripts/release_notes.py "$TAG" > release-notes.md
        env:
          TAG: ${{ github.ref_name }}

      - name: Create the draft release
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file release-notes.md --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
