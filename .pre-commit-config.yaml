---
ci:
  autofix_commit_msg: ":rotating_light: pre-commit fixes"
  # No autoupdate: the markdownlint rev is pinned in step with the version the
  # docs workflows install, so a bump has to move both. ci.yml runs these
  # hooks itself through `make lint`.
  # pylint/mypy/black run `uv run` against the local environment, which
  # pre-commit.ci does not have. ansible-lint needs `ansible-galaxy install`,
  # and pre-commit.ci hooks have no network access.
  skip:
    - ansible-lint
    - pylint
    - mypy
    - black
repos:
  - repo: https://github.com/ansible-community/ansible-lint.git
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        # Lint the same scope as CI; a bare run also scans molecule test playbooks.
        args: [nas.yml]
        additional_dependencies:
          - ansible-core==2.21.4
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
  # Use the versions pinned in pyproject.toml/uv.lock instead of a separate pin.
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # CI (GitHub's ubuntu-26.04 runner) hits a mypy internal error while
        # writing the incremental cache after a clean check; --no-incremental
        # skips that write. --show-traceback exposes the real traceback if it
        # ever crashes somewhere else.
        args: [--no-incremental, --show-traceback]
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
