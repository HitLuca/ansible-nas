---
ci:
  autofix_commit_msg: ":rotating_light: pre-commit fixes"
  # No autoupdate: these revs are pinned in step with the versions ci.yml and
  # the docs workflows install, so a bump has to move all of them together.
  # pylint/mypy run `uv run` against the local environment, which
  # pre-commit.ci does not have. ansible-lint needs `ansible-galaxy install`,
  # and pre-commit.ci hooks have no network access. All three still run in CI.
  skip:
    - ansible-lint
    - pylint
    - mypy
repos:
  - repo: https://github.com/ansible-community/ansible-lint.git
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        # Lint the same scope as CI; a bare run also scans molecule test playbooks.
        args: [nas.yml]
        additional_dependencies:
          - ansible-core==2.21.4
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
  # Use the versions pinned in pyproject.toml/uv.lock instead of a separate pin.
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
