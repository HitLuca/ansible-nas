---
repos:
  - repo: https://github.com/ansible-community/ansible-lint.git
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        # Lint the same scope as CI; a bare run also scans molecule test playbooks.
        args: [nas.yml]
        additional_dependencies:
          - ansible-core==2.21.4
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.32.2
    hooks:
      - id: markdownlint
