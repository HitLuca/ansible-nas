[project]
name = "ansible-nas"
version = "0.1.0"
description = "Tooling environment for testing ansible-nas roles"
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.21.4",
    "molecule==26.10.0",
    "molecule-plugins[docker]==26.10.12",
    "pre-commit==4.7.0",
]

[tool.uv]
package = false

# The tools CI and make call live in scripts/; the tests under tests/ import
# them by module name.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.mypy]
mypy_path = "scripts"

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'scripts')"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy==1.20.2",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261103",
]
