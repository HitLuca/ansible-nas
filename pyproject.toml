[project]
name = "ansible-nas"
version = "0.1.0"
description = "Tooling environment for testing ansible-nas roles"
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.21.4",
    "molecule==26.11.0",
    "molecule-plugins[docker]==26.10.12",
    "pre-commit==4.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261103",
]
