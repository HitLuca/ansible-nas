---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Roles start their containers through the socket above, so the containers
      # are siblings of this instance and bind-mount paths are resolved on the
      # host. Share docker_home with the host, or those mounts are empty,
      # root-owned directories the container can't write to.
      - /tmp/ansible-nas:/tmp/ansible-nas
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    # The playbooks include the role under test by name; molecule no longer
    # adds the role's parent directory to the roles path on its own.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    group_vars:
      all:
        samba_shares_root: /tmp/ansible-nas/shares
        ansible_nas_domain: ansible-nas.io
        ansible_nas_timezone: Europe/London
        audiobooks_root: /tmp/ansible-nas/shares/audiobooks
        books_root: /tmp/ansible-nas/shares/books
        code_root: /tmp/ansible-nas/shares/code
        comics_root: /tmp/ansible-nas/shares/comics
        docker_home: /tmp/ansible-nas/docker
        documents_root: /tmp/ansible-nas/shares/documents
        downloads_root: /tmp/ansible-nas/shares/downloads
        movies_root: /tmp/ansible-nas/shares/movies
        music_root: /tmp/ansible-nas/shares/music
        photos_root: /tmp/ansible-nas/shares/photos
        podcasts_root: /tmp/ansible-nas/shares/podcasts
        torrents_root: /tmp/ansible-nas/shares/torrents
        tv_root: /tmp/ansible-nas/shares/tv
        roms_root: /tmp/ansible-nas/shares/roms
        recordings_root: /tmp/ansible-nas/shares/recordings
        websites_root: /tmp/ansible-nas/shares/websites
  playbooks:
    prepare: ../../../../tests/molecule/resources/playbooks/prepare.yml
    converge: ../../../../tests/molecule/resources/playbooks/converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - verify verify_stopped.yml
    - cleanup
    - destroy
