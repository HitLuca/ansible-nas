---
server:
  http_listen_port: {{ loki_http_port }}
  log_level: {{ loki_log_level }}

schema_config:
  configs:
    - from: 2021-08-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/data/chunks
      rules_directory: /loki/data/rules
  ring:
    kvstore:
      store: memberlist

ruler:
  storage:
    type: local
    local:
      directory: /loki/data/rules

limits_config:
  # Loki 3 requires schema v13 for structured metadata; stay on v11 so existing
  # installs keep their index and chunks.
  allow_structured_metadata: false
  retention_period: {{ loki_log_retention }}

compactor:
  working_directory: /loki/data/compactor
  retention_enabled: true
  delete_request_store: filesystem
