---
server:
  http_listen_port: {{ loki_http_port }}
  log_level: {{ loki_log_level }}

memberlist:

schema_config:
  configs:
    - from: 2021-08-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/data/chunks
      rules_directory: /loki/data/rules
  ring:
    kvstore:
      store: memberlist

ruler:
  storage:
    filesystem:
      rules_directory: /loki/data/rules

chunk_store_config:
  max_look_back_period: {{ loki_log_retention }}

table_manager:
  retention_deletes_enabled: true
  retention_period: {{ loki_log_retention }}
