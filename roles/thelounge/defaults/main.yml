---
thelounge_enabled: false
thelounge_available_externally: false

# Directories
thelounge_data_directory: "{{ docker_home }}/thelounge"

# Networking
thelounge_port_one: "113"
thelounge_port_two: "9002"
thelounge_hostname: thelounge

# Container
thelounge_memory: 1g
thelounge_container_name: "thelounge"
thelounge_image_name: "thelounge/thelounge"
thelounge_image_version: "latest"
# The image runs as the node user (UID/GID 1000); the data folder is chowned
# to these so it can read and write it.
thelounge_user_id: "1000"
thelounge_group_id: "1000"

# monitoring
thelounge_uptime_kuma_monitor: "{{ uptime_kuma_monitor_all_services | default(false) }}"
