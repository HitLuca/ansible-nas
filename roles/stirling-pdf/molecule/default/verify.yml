---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Stirling PDF container state
      community.docker.docker_container_info:
        name: "{{ stirling_pdf_container_name }}"
      register: result
      until: >-
        result.container['State']['Status'] == "running"
        and result.container['State']['Restarting'] == false
      retries: 60
      delay: 5

    - name: Check Stirling PDF is running
      ansible.builtin.assert:
        that:
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false

    # The image boots a Spring app behind this endpoint; "running" alone does
    # not mean it came up.
    - name: Check Stirling PDF answers its status endpoint
      community.docker.docker_container_exec:
        container: "{{ stirling_pdf_container_name }}"
        argv:
          - curl
          - -fs
          - http://localhost:8080/api/v1/info/status
      register: health
      failed_when: false
      until: health.rc == 0
      retries: 60
      delay: 5
      changed_when: false
