---
- name: Start Cloudflared
  block:
    - name: Check Cloudflared token is set
      ansible.builtin.assert:
        that: cloudflared_token | length > 0
        fail_msg: cloudflared_token is required. Copy the tunnel token from the Cloudflare Zero Trust dashboard.

    - name: Cloudflared Container
      community.docker.docker_container:
        name: "{{ cloudflared_container_name }}"
        image: "{{ cloudflared_image_name }}:{{ cloudflared_image_version }}"
        pull: true
        env:
          TZ: "{{ ansible_nas_timezone }}"
        command: tunnel --no-autoupdate run --token {{ cloudflared_token }}
        restart_policy: unless-stopped
        memory: "{{ cloudflared_memory }}"
        network_mode: host
        labels:
  when: cloudflared_enabled is true

- name: Stop Cloudflared
  block:
    - name: Stop Cloudflared
      community.docker.docker_container:
        name: "{{ cloudflared_container_name }}"
        state: absent
  when: cloudflared_enabled is false
