---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ uptime_kuma_container_name }}"
      register: result

    - name: Check Uptime Kuma is running
      ansible.builtin.assert:
        that:
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false

    - name: Get discovery container state
      community.docker.docker_container_info:
        name: "{{ uptime_kuma_discovery_container_name }}"
      register: discovery

    - name: Check AutoKuma is running
      ansible.builtin.assert:
        that:
          - discovery.container['State']['Status'] == "running"
          - discovery.container['State']['Restarting'] == false
