---
ombi_enabled: false
ombi_available_externally: false

# directories
ombi_config_directory: "{{ docker_home }}/ombi/config"

# network
ombi_port: "3579"
ombi_hostname: "ombi"

# docker
ombi_container_name: "ombi"
ombi_image_name: "linuxserver/ombi"
ombi_image_version: "4.53.10"
ombi_user_id: "0"
ombi_group_id: "0"

# specs
ombi_memory: 1g

# monitoring
ombi_uptime_kuma_monitor: "{{ uptime_kuma_monitor_all_services | default(false) }}"
