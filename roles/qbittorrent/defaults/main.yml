---
qbittorrent_enabled: false
qbittorrent_available_externally: false

# directories
qbittorrent_config_directory: "{{ docker_home }}/qbittorrent"
qbittorrent_download_directory: "{{ downloads_root }}"
qbittorrent_watch_directory: "{{ torrents_root }}"

# uid / gid
qbittorrent_user_id: "0"
qbittorrent_group_id: "0"

# network
qbittorrent_port: "8019"
qbittorrent_hostname: qbittorrent

# docker
qbittorrent_container_name: qbittorrent
qbittorrent_image_name: linuxserver/qbittorrent
qbittorrent_image_version: 5.3.0

# specs
qbittorrent_memory: 1g

# monitoring
qbittorrent_uptime_kuma_monitor: "{{ uptime_kuma_monitor_all_services | default(false) }}"
