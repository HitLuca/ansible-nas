---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Alloy container state
      community.docker.docker_container_info:
        name: "{{ alloy_container_name }}"
      register: result_alloy
      until: >-
        result_alloy.container['State']['Status'] == "running"
        and result_alloy.container['State']['Restarting'] == false
      retries: 30
      delay: 2

    # A bad config makes alloy exit immediately and the unless-stopped policy
    # restarts it, so a running-but-crash-looping container must fail too.
    - name: Let Alloy settle
      ansible.builtin.pause:
        seconds: 5

    - name: Re-check Alloy container state
      community.docker.docker_container_info:
        name: "{{ alloy_container_name }}"
      register: result_alloy

    - name: Check if Alloy container is running without restarting
      ansible.builtin.assert:
        that:
          - result_alloy.exists
          - result_alloy.container['State']['Status'] == "running"
          - result_alloy.container['State']['Restarting'] == false
          - result_alloy.container['RestartCount'] == 0
