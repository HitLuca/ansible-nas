---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Alloy
      community.docker.docker_container:
        name: "{{ alloy_container_name }}"
        state: absent
      register: result_alloy

    - name: Check if Alloy container is stopped
      ansible.builtin.assert:
        that:
          - not result_alloy.changed
