---
- name: Start Alloy
  block:
    - name: Create Alloy Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ alloy_data_directory }}"
        - "{{ alloy_data_directory }}/data"

    - name: Template Alloy config
      ansible.builtin.template:
        src: config.alloy
        dest: "{{ alloy_data_directory }}/config.alloy"
      register: alloy_config

    - name: Alloy Docker Container
      community.docker.docker_container:
        name: "{{ alloy_container_name }}"
        image: "{{ alloy_image_name }}:{{ alloy_image_version }}"
        pull: true
        command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
        volumes:
          - "{{ alloy_data_directory }}/config.alloy:/etc/alloy/config.alloy:ro"
          - "{{ alloy_data_directory }}/data:/var/lib/alloy/data"
          - /var/run/docker.sock:/var/run/docker.sock:ro
        restart_policy: unless-stopped
        memory: "{{ alloy_memory }}"
        restart: "{{ alloy_config is changed }}"
  when: alloy_enabled is true

- name: Stop Alloy
  block:
    - name: Stop Alloy
      community.docker.docker_container:
        name: "{{ alloy_container_name }}"
        state: absent
  when: alloy_enabled is false
