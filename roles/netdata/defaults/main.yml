---
netdata_enabled: false
netdata_available_externally: false

# network
netdata_hostname: "netdata"
netdata_port: "19999"

# docker
netdata_container_name: "netdata"
netdata_image_name: "netdata/netdata"
netdata_image_version: "v2.12.3"

# specs
netdata_memory: 1g

# monitoring
netdata_uptime_kuma_monitor: "{{ uptime_kuma_monitor_all_services | default(false) }}"
