---
drone_ci_enabled: false
drone_ci_available_externally: false
drone_ci_data_directory: "{{ docker_home }}/drone-ci"
drone_ci_port_http: 8001
drone_ci_runner_port_http: 8002
drone_ci_address: http://{{ hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address'] }}:{{ drone_ci_port_http }}
drone_ci_hostname: drone-ci
drone_ci_memory: 1g
drone_ci_agent_memory: 1g
drone_ci_container_name: drone-ci
drone_ci_runner_container_name: drone-ci-runner
drone_ci_image_name: drone/drone
drone_ci_image_version: "2"
drone_ci_runner_image_name: drone/drone-runner-docker
drone_ci_runner_image_version: "1"
drone_ci_admin_user: david
drone_ci_agent_secret: ""
drone_ci_debug_logging: false
drone_ci_gitea_url: http://{{ hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address'] }}:{{ gitea_port_http }}
drone_ci_gitea_client_id: notset
drone_ci_gitea_client_secret: ""
drone_ci_runner_capacity: 2
drone_ci_runner_name: "{{ ansible_nas_hostname }}"
drone_ci_uptime_kuma_monitor: "{{ uptime_kuma_monitor_all_services | default(false) }}"
