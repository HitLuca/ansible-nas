---
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp:rw
    privileged: true
    pre_build_image: true
provisioner:
  inventory:
    group_vars:
      all:
        prometheus_enabled: true
        ansible_nas_hostname: "ansible-nas"
        prometheus_data_directory: "/tmp/prometheus/data"
        prometheus_config_directory: "/tmp/prometheus/config"
        prometheus_telegraf_config_directory: "/tmp/telegraf/config"
        prometheus_collection_interval: 15s
