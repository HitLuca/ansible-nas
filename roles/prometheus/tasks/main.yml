---
- name: Start Prometheus
  block:
    - name: Create Prometheus Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      with_items:
        - "{{ prometheus_data_directory }}"
        - "{{ prometheus_config_directory }}"

    - name: Template Prometheus config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_directory }}/prometheus.yml"
      register: prometheus_config

    - name: Prometheus Docker Container
      community.docker.docker_container:
        name: "{{ prometheus_container_name }}"
        image: "{{ prometheus_image_name }}:{{ prometheus_image_version }}"
        pull: true
        volumes:
          - "{{ prometheus_config_directory }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          - "{{ prometheus_data_directory }}:/prometheus:rw"
        ports:
          - "{{ prometheus_port }}:9090"
        restart_policy: unless-stopped
        memory: "{{ prometheus_memory }}"
        restart: "{{ prometheus_config is changed }}"
        command: "--config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.size={{ prometheus_retention_size }} --storage.tsdb.retention.time={{ prometheus_retention_time }}"
        labels:
          traefik.enable: "{{ prometheus_available_externally | string }}"
          traefik.http.routers.prometheus.rule: "Host(`{{ prometheus_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.prometheus.tls.certresolver: "letsencrypt"
          traefik.http.routers.prometheus.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.prometheus.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.prometheus.loadbalancer.server.port: "9090"
          homepage.group: Monitoring
          homepage.name: Prometheus
          homepage.icon: prometheus
          homepage.href: "http://{{ ansible_facts.default_ipv4.address }}:{{ prometheus_port }}"
          homepage.description: Metrics and alerting
          homepage.widget.type: prometheus
          homepage.widget.url: "http://{{ ansible_facts.default_ipv4.address }}:{{ prometheus_port }}"
          kuma.prometheus.http.name: "Prometheus"
          kuma.prometheus.http.url: "{{ 'http://' ~ ansible_facts.default_ipv4.address ~ ':' ~ prometheus_port if prometheus_uptime_kuma_monitor else omit }}"

    - name: Create Telegraf Directory
      ansible.builtin.file:
        path: "{{ prometheus_telegraf_config_directory }}"
        state: directory

    - name: Template telegraf.conf
      ansible.builtin.template:
        src: telegraf.conf.j2
        dest: "{{ prometheus_telegraf_config_directory }}/telegraf.conf"
      register: prometheus_telegraf_config

    - name: Get Docker daemon gid
      ansible.builtin.command: stat -c '%g' /var/run/docker.sock
      register: prometheus_docker_gid
      changed_when: false

    - name: Telegraf Docker Container
      community.docker.docker_container:
        name: "{{ prometheus_telegraf_container_name }}"
        image: "{{ prometheus_telegraf_image_name }}:{{ prometheus_telegraf_image_version }}"
        pull: true
        privileged: true
        ipc_mode: host
        ports:
          - "{{ prometheus_telegraf_port }}:9273"
        user: "telegraf:{{ prometheus_docker_gid.stdout }}"
        volumes:
          - "{{ prometheus_telegraf_config_directory }}:/etc/telegraf/:ro"
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
          - "/:/hostfs:ro"
          - "/etc:/hostfs/etc:ro"
          - "/proc:/hostfs/proc:ro"
          - "/sys:/hostfs/sys:ro"
          - "/var:/hostfs/var:ro"
          - "/run:/hostfs/run:ro"
        env:
          HOST_ETC: "/hostfs/etc"
          HOST_PROC: "/hostfs/proc"
          HOST_SYS: "/hostfs/sys"
          HOST_VAR: "/hostfs/var"
          HOST_RUN: "/hostfs/run"
          HOST_MOUNT_PREFIX: "/hostfs"
        restart_policy: unless-stopped
        memory: "{{ prometheus_telegraf_memory }}"
        restart: "{{ prometheus_telegraf_config is changed }}"

    - name: Smartctl Exporter Docker Container
      community.docker.docker_container:
        name: "{{ prometheus_smartctl_container_name }}"
        image: "{{ prometheus_smartctl_image_name }}:{{ prometheus_smartctl_image_version }}"
        pull: true
        privileged: true
        ports:
          - "{{ prometheus_smartctl_port }}:9902"
        restart_policy: unless-stopped
        memory: "{{ prometheus_smartctl_memory }}"

    - name: Speedtest Exporter Docker Container
      community.docker.docker_container:
        name: "{{ prometheus_speedtest_container_name }}"
        image: "{{ prometheus_speedtest_image_name }}:{{ prometheus_speedtest_image_version }}"
        pull: true
        ports:
          - "{{ prometheus_speedtest_port }}:9798"
        restart_policy: unless-stopped
        memory: "{{ prometheus_speedtest_memory }}"
      when: prometheus_speedtest_enabled is true
  when: prometheus_enabled is true

- name: Stop Prometheus
  block:
    - name: Stop Prometheus
      community.docker.docker_container:
        name: "{{ prometheus_container_name }}"
        state: absent
    - name: Stop Telegraf
      community.docker.docker_container:
        name: "{{ prometheus_telegraf_container_name }}"
        state: absent
    - name: Stop Smartctl Exporter
      community.docker.docker_container:
        name: "{{ prometheus_smartctl_container_name }}"
        state: absent
    - name: Stop Speedtest Exporter
      community.docker.docker_container:
        name: "{{ prometheus_speedtest_container_name }}"
        state: absent
  when: prometheus_enabled is false
