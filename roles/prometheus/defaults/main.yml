---
prometheus_enabled: false
prometheus_available_externally: false
prometheus_speedtest_enabled: false

# directories
prometheus_data_directory: "{{ docker_home }}/prometheus/data"
prometheus_config_directory: "{{ docker_home }}/prometheus/config"
prometheus_telegraf_config_directory: "{{ docker_home }}/prometheus/telegraf/config"

# network
prometheus_port: "9090"
prometheus_hostname: prometheus
prometheus_telegraf_port: "9273"
prometheus_smartctl_port: "9902"
prometheus_speedtest_port: "9798"

# docker
prometheus_container_name: prometheus
prometheus_image_name: prom/prometheus
prometheus_image_version: v3.16.0
prometheus_telegraf_container_name: telegraf
prometheus_telegraf_image_name: telegraf
prometheus_telegraf_image_version: 1.40.3
prometheus_smartctl_container_name: smartctl-exporter
prometheus_smartctl_image_name: prometheuscommunity/smartctl-exporter
prometheus_smartctl_image_version: v0.15.0
prometheus_speedtest_container_name: speedtest-exporter
prometheus_speedtest_image_name: miguelndecarvalho/speedtest-exporter
prometheus_speedtest_image_version: v3.5.4

# specs
prometheus_memory: 1g
prometheus_telegraf_memory: 1g
prometheus_smartctl_memory: 1g
prometheus_speedtest_memory: 256m

# config
prometheus_retention_time: 365d
prometheus_retention_size: 30GB
prometheus_collection_interval: 15s
prometheus_speedtest_collection_interval: 1h

# uncomment to scrape more hosts
# prometheus_additional_hosts:
#  - 192.168.1.1:9100

# uncomment to scrape metrics from HomeAssistant. You'll need a long lived access token.
# prometheus_hass_long_lived_access_token: addfasdfasdf

# monitoring
prometheus_uptime_kuma_monitor: "{{ uptime_kuma_monitor_all_services | default(false) }}"
