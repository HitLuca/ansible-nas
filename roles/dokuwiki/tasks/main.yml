---
- name: Start Dokuwiki
  block:
    - name: Create DokuWiki Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ dokuwiki_data_directory }}/data"

    - name: DokuWiki Docker Container
      community.docker.docker_container:
        name: "{{ dokuwiki_container_name }}"
        image: "{{ dokuwiki_image_name }}:{{ dokuwiki_image_version }}"
        pull: true
        volumes:
          - "{{ dokuwiki_data_directory }}:/config/dokuwiki/data:rw"
        ports:
          - "{{ dokuwiki_port }}:80"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          PUID: "{{ dokuwiki_user_id | string }}"
          PGID: "{{ dokuwiki_group_id | string }}"
        restart_policy: unless-stopped
        memory: "{{ dokuwiki_memory }}"
        labels:
          traefik.enable: "{{ dokuwiki_available_externally | string }}"
          traefik.http.routers.dokuwiki.rule: "Host(`{{ dokuwiki_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.dokuwiki.tls.certresolver: "letsencrypt"
          traefik.http.routers.dokuwiki.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.dokuwiki.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.dokuwiki.loadbalancer.server.port: "80"
          kuma.dokuwiki.http.name: "DokuWiki"
          kuma.dokuwiki.http.url: "{{ 'http://' ~ ansible_facts.default_ipv4.address ~ ':' ~ dokuwiki_port if dokuwiki_uptime_kuma_monitor else omit }}"
          homepage.group: Productivity
          homepage.name: DokuWiki
          homepage.icon: dokuwiki.png
          homepage.href: "http://{{ hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address'] }}:{{ dokuwiki_port }}"
          homepage.description: Wiki
  when: dokuwiki_enabled is true

- name: Stop Dokuwiki
  block:
    - name: Stop Dokuwiki
      community.docker.docker_container:
        name: "{{ dokuwiki_container_name }}"
        state: absent
  when: dokuwiki_enabled is false
