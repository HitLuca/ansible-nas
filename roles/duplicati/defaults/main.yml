---
duplicati_enabled: false
duplicati_available_externally: false

# directories
duplicati_data_directory: "{{ docker_home }}/duplicati/config"

duplicati_media_directory: "/media"

# permissions
duplicati_data_permissions: "rw" # set this to rw to enable the ability to restore data

# uid / gid
duplicati_user_id: "0"
duplicati_group_id: "0"

# network
duplicati_port: "8200"
duplicati_hostname: "duplicati"

duplicati_memory: 1g

# docker
duplicati_container_name: duplicati
duplicati_image_name: "linuxserver/duplicati"
duplicati_image_version: "latest"

duplicati_settings_encryption_key: ""
