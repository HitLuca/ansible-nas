---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Paperless-ngx Postgres container state
      community.docker.docker_container_info:
        name: "{{ paperless_ngx_postgres_container_name }}"
      register: result_postgres
      until: >-
        result_postgres.container['State']['Status'] == "running"
        and result_postgres.container['State']['Restarting'] == false
      retries: 30
      delay: 2

    - name: Get Paperless-ngx Valkey container state
      community.docker.docker_container_info:
        name: "{{ paperless_ngx_valkey_container_name }}"
      register: result_valkey
      until: >-
        result_valkey.container['State']['Status'] == "running"
        and result_valkey.container['State']['Restarting'] == false
      retries: 30
      delay: 2

    - name: Get Paperless-ngx container state
      community.docker.docker_container_info:
        name: "{{ paperless_ngx_container_name }}"
      register: result
      until: >-
        result.container['State']['Status'] == "running"
        and result.container['State']['Restarting'] == false
      retries: 60
      delay: 5

    - name: Check Paperless-ngx containers are running
      ansible.builtin.assert:
        that:
          - result_postgres.container['State']['Status'] == "running"
          - result_postgres.container['State']['Restarting'] == false
          - result_valkey.container['State']['Status'] == "running"
          - result_valkey.container['State']['Restarting'] == false
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false
