---
- name: Start Speedtest-Tracker
  block:
    - name: Check Speedtest-Tracker app key is set
      ansible.builtin.assert:
        that: speedtest_tracker_app_key | length > 0
        fail_msg: >-
          speedtest_tracker_app_key is required. Generate one with
          echo "base64:$(openssl rand -base64 32)" and set it in your inventory.

    - name: Speedtest-Tracker Directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        # Separate from the old henrywhitaker3 image's "config" folder, whose data isn't compatible.
        - "{{ speedtest_data_directory }}/data"

    - name: Speedtest-Tracker Docker Container
      community.docker.docker_container:
        name: "{{ speedtest_container_name }}"
        image: "{{ speedtest_image_name }}:{{ speedtest_image_version }}"
        pull: true
        volumes:
          - "{{ speedtest_data_directory }}/data:/config:rw"
        ports:
          - "{{ speedtest_tracker_port }}:80"
        env:
          PUID: "{{ speedtest_tracker_user_id | string }}"
          PGID: "{{ speedtest_tracker_group_id | string }}"
          TZ: "{{ ansible_nas_timezone }}"
          APP_KEY: "{{ speedtest_tracker_app_key }}"
          APP_URL: "{{ speedtest_tracker_app_url }}"
          DB_CONNECTION: "sqlite"
          SPEEDTEST_SCHEDULE: "{{ speedtest_tracker_schedule }}"
          DISPLAY_TIMEZONE: "{{ ansible_nas_timezone }}"
        restart_policy: unless-stopped
        memory: "{{ speedtest_tracker_memory }}"
        labels:
          traefik.enable: "{{ speedtest_tracker_available_externally | string }}"
          traefik.http.routers.speedtest_tracker.rule: "Host(`{{ speedtest_tracker_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.speedtest_tracker.tls.certresolver: "letsencrypt"
          traefik.http.routers.speedtest_tracker.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.speedtest_tracker.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.speedtest_tracker.loadbalancer.server.port: "80"
          kuma.speedtest-tracker.http.name: "Speedtest-Tracker"
          kuma.speedtest-tracker.http.url: "{{ 'http://' ~ ansible_facts.default_ipv4.address ~ ':' ~ speedtest_tracker_port if speedtest_tracker_uptime_kuma_monitor else omit }}"
  when: speedtest_tracker_enabled is true

- name: Stop Speedtest-Tracker
  block:
    - name: Stop Speedtest-Tracker
      community.docker.docker_container:
        name: "{{ speedtest_container_name }}"
        state: absent
  when: speedtest_tracker_enabled is false
