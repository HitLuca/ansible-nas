---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    # docker_container_info is read-only. The docker_container module compares
    # the container against the image's built-in env when only a name is given,
    # and recreates it with that env, undoing the role's settings.
    - name: Get tdarr container state
      community.docker.docker_container_info:
        name: "{{ tdarr_container_name }}"
      register: result

    - name: Check if tdarr containers are running
      ansible.builtin.assert:
        that:
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false

    # The internal node exits its start script into `sleep infinity` unless
    # `internalNode` is the literal string "true", yet the container still
    # reports healthy, so assert the process itself. Its start script waits
    # 10 seconds for the server first, hence the retries.
    - name: Look for the internal tdarr node process
      community.docker.docker_container_exec:
        container: "{{ tdarr_container_name }}"
        argv:
          - pgrep
          - -f
          - "Tdarr_Node/Tdarr_Node$"
      register: tdarr_node_process
      changed_when: false
      failed_when: false
      until: tdarr_node_process.rc == 0
      retries: 30
      delay: 2

    - name: Check if the internal tdarr node is running
      ansible.builtin.assert:
        that:
          - tdarr_node_process.rc == 0
