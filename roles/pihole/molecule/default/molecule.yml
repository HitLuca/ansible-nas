---
provisioner:
  inventory:
    group_vars:
      all:
        pihole_enabled: true
        # 53 is usually taken by systemd-resolved on CI runners (and 5353 by
        # mDNS), and Docker Desktop cannot publish on the instance's own bridge
        # address.
        pihole_dns_port: "15353"
        pihole_dns_bind_address: "0.0.0.0"
