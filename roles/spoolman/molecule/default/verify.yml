---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get spoolman container state
      community.docker.docker_container_info:
        name: "{{ spoolman_container_name }}"
      register: result

    - name: Check if spoolman is running
      ansible.builtin.assert:
        that:
          - result.container['State']['Status'] == "running"
          - result.container['State']['Restarting'] == false
          # Authelia is opt-in; with the flag off the label must not exist at
          # all, rather than pointing at a middleware that may not be deployed.
          - "'traefik.http.routers.spoolman.middlewares' not in result.container['Config']['Labels']"
