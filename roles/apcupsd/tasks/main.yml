---

- name: Start Apcupsd
  block:
    - name: Create Apcupsd Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ apcupsd_data_directory }}"

    - name: Create Apcupsd config directory
      ansible.builtin.file:
        path: "{{ apcupsd_data_directory }}/apcupsd"
        state: directory
        mode: "0755"

    - name: Create Apcupsd config file
      ansible.builtin.copy:
        dest: "{{ apcupsd_data_directory }}/apcupsd/apcupsd.conf"
        content: "# Minimal apcupsd configuration for testing\nUPSCABLE usb\nUPSNAME LocalUPS\n"
        mode: "0644"

    - name: Apcupsd Docker Container
      community.docker.docker_container:
        name: "{{ apcupsd_container_name }}"
        image: gregewing/apcupsd
        pull: true
        privileged: true
        volumes:
          - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
          - "{{ apcupsd_data_directory }}/apcupsd:/etc/apcupsd"
        ports:
          - "{{ apcupsd_port }}:3551"
        devices:
          - "{{ apcupsd_device }}:{{ apcupsd_device }}"
        env:
          TZ: "{{ ansible_nas_timezone }}"
        restart_policy: unless-stopped
        memory: "{{ apcupsd_memory }}"
      when: apcupsd_enabled is true

    - name: Apcupsd Docker Container
      community.docker.docker_container:
        name: "{{ apcupsd_container_name }}"
        image: gregewing/apcupsd
        pull: true
        privileged: true
        volumes:
          - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
          - "{{ apcupsd_data_directory }}/apcupsd.conf:/etc/apcupsd/apcupsd.conf"
        ports:
          - "{{ apcupsd_port }}:3551"
        devices:
          - "{{ apcupsd_device }}:{{ apcupsd_device }}"
        env:
          TZ: "{{ ansible_nas_timezone }}"
        restart_policy: unless-stopped
        memory: "{{ apcupsd_memory }}"
  when: apcupsd_enabled is true

- name: Stop Apcupsd
  block:
    - name: Stop Apcupsd
      community.docker.docker_container:
        name: "{{ apcupsd_container_name }}"
        state: absent
  when: apcupsd_enabled is false
