---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get transmission container state
      community.docker.docker_container_info:
        name: "{{ transmission_openvpn_container_name }}"
      register: result

    - name: Check transmission container was created
      ansible.builtin.assert:
        that:
          - result.container is not none
      # The container exits in CI because OpenVPN cannot connect with test
      # credentials, so do not assert on State.Status == "running" here.
